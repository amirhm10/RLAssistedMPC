name: rl-assisted-env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13.2
  - pip
  - libblas=*=*openblas
  - libcblas=*=*openblas
  - liblapack=*=*openblas
  # Pinned numerical runtime after the 2026-10-14 native-crash recovery.
  - libopenblas=0.3.33
  - numpy=2.4.6
  - scipy=1.17.1
  - matplotlib-base
  - pandas
  - scikit-learn
  - control
  - joblib
  - ipykernel
  - pytest
  - pywin32
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.13.0+cu130
